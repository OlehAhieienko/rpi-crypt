# Raspberry Pi 5 example profile

# Change those
LUKS_PASSWORD='changeme'
ROOT_PASSWORD='changeme'

# Other settings
TARGET_IMAGE='rpi5-luks-trixie.img'
TARGET_IMAGE_SIZE=3000  # Size of target image, megabytes
BUILD_LOG='rpi5-luks-trixie.log'
DEBOOTSTRAP_SUITE='trixie' # Tested only with 'trixie'. Use release code name (eg, trixie, forky) and **not** symbolic name (eg, stable, testing).
LUKS_DEV='cryptroot'
LUKS_FORMAT_ARGS='--iter-time 2000 --hash sha256 --key-size 512 --pbkdf=argon2id --cipher=aes-xts-plain64'
# Only from debian.org repo:
DEBOOTSTRAP_PACKAGES=(raspi-firmware cryptsetup cryptsetup-initramfs initramfs-tools zstd locales console-setup netbase)
# From both debian.org and raspberrypi.com repos:
RPI_PACKAGES=(linux-image-rpi-v8 linux-headers-rpi-v8 linux-image-rpi-2712 linux-headers-rpi-2712)      # Kernels and headers
RPI_PACKAGES+=(raspi-utils rpi-update rpi-eeprom rpifwcrypto raspi-config raspberrypi-archive-keyring)  # Raspberry Pi packages
RPI_PACKAGES+=(firmware-brcm80211 firmware-realtek firmware-mediatek)                                   # Firmware
RPI_PACKAGES+=(apt-transport-https ca-certificates systemd-timesyncd ssh sudo parted curl ntfs-3g)      # System stuff
RPI_PACKAGES+=(network-manager wireguard-tools file zip unzip unrar xz-utils)                           # More system stuff

# For remote LUKS unlock. Only packages installation - you must configure keys by yourself.
# RPI_PACKAGES+=(dropbear dropbear-initramfs)
